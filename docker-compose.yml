services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  coce:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Compose-network specific: overrides whatever COCE_REDIS_HOST is set
      # to in .env, since "redis" is only resolvable inside this network.
      COCE_REDIS_HOST: redis
      COCE_REDIS_PORT: "6379"
    depends_on:
      - redis

volumes:
  redis-data:
