<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coce Client Sample</title>
    <script src="coceclient.js"></script>
  </head>
  <body>
    <span id="coce-thumbnail1" data-id="2251005714"></span>
    <span id="coce-thumbnail2" data-id="9780415480635"></span>
    <span id="coce-thumbnail3" data-id="9780821417492"></span>
    <span id="coce-thumbnail4" data-id="2847342257"></span>
    <span id="coce-thumbnail5" data-id="9780563533191"></span>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const ids = [...document.querySelectorAll('[id^="coce-thumbnail"]')].map(
          (el) => el.dataset.id,
        );
        if (ids.length === 0) return;

        const client = new CoceClient('http://localhost:8080', 'ol,gb,aws');
        client
          .fetch(ids, (id, url) => {
            for (const el of document.querySelectorAll(`[data-id="${id}"]`)) {
              const img = document.createElement('img');
              img.src = url;
              img.title = url;
              el.append(img);
            }
          })
          .catch((err) => console.error('coce fetch failed:', err));
      });
    </script>
  </body>
</html>
